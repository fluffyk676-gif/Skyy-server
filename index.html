<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Skyy — самокаты</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--sky:#0ea5e9;--bg:#f8fafc;--panel:#fff;--ink:#0f172a;--muted:#64748b;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--shadow:0 10px 30px rgba(2,132,199,.15)}
  body{margin:0;font-family:-apple-system,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  body.dark { --bg:#0f172a; --panel:#1e293b; --ink:#f1f5f9; --muted:#94a3b8; }
  #app{position:relative;height:100dvh;max-width:480px;margin:0 auto;overflow:hidden}
  #map{position:absolute;inset:0;z-index:1;background:#eef2f7}
  
  .topbar{position:absolute;top:0;left:0;right:0;z-index:500;padding:14px;display:flex;gap:8px}
  .logo{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:12px;font-weight:800;font-size:18px}
  .search-btn{flex:1;background:var(--panel);border:none;border-radius:14px;box-shadow:var(--shadow);text-align:left;padding:0 16px;color:var(--muted);font-size:14px;cursor:pointer}
  .icon-btn{width:44px;height:44px;background:var(--panel);border:none;border-radius:14px;box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center;cursor:pointer}
  
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:500;background:var(--panel);border-radius:24px 24px 0 0;padding:20px;box-shadow:0 -10px 40px rgba(0,0,0,.1);max-height:70vh;display:flex;flex-direction:column}
  .scooter{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;cursor:pointer;border:2px solid transparent}
  .scooter:hover{background:rgba(0,0,0,0.05)}
  body.dark .scooter:hover{background:rgba(255,255,255,0.05)}
  
  .btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer;margin-top:10px}
  .btn-primary{background:var(--sky);color:#fff}
  .btn-ghost{background:rgba(0,0,0,0.05);color:var(--ink)}
  body.dark .btn-ghost{background:rgba(255,255,255,0.1)}
  .btn-ring{background:var(--amber);color:#fff;margin-top:8px}
  
  .marker{background:var(--sky);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:pulse 2s infinite;font-size:18px}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(14,165,233,.3)}50%{box-shadow:0 0 0 12px rgba(14,165,233,.1)}}
  
  .toast{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px;border-radius:8px;z-index:900;opacity:0;transition:.3s}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  
  <div class="topbar">
    <div class="logo">Skyy</div>
    <button class="search-btn" onclick="toast('Поиск в разработке')">🔍 Куда поедем?</button>
    <button class="icon-btn" onclick="locateMe()">📍</button>
  </div>

  <div class="sheet" id="sheet">
    <h2 style="margin:0 0 12px">Самокаты рядом</h2>
    <div id="scooterList" style="overflow-y:auto;flex:1"></div>
    <div style="color:var(--muted);font-size:12px;text-align:center;margin-top:10px" id="serverStatus">Подключение...</div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const API_BASE = 'https://skyy-server.onrender.com'; 
const state = { scooters: [], userPos: [55.75, 37.61], map: null, markers: {}, selected: null, ride: null, userMarker: null };

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3000); }

function initMap(){
  state.map = L.map('map', {zoomControl:false}).setView(state.userPos, 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(state.map);
  
  navigator.geolocation.getCurrentPosition((pos) => {
    state.userPos = [pos.coords.latitude, pos.coords.longitude];
    state.map.setView(state.userPos, 16);
    state.userMarker = L.circleMarker(state.userPos, {radius: 8, color: '#fff', weight: 3, fillColor: '#0ea5e9', fillOpacity: 1}).addTo(state.map);
  }, (err) => { console.log("GPS Error:", err); }, { enableHighAccuracy: true });
}

function locateMe(){
  if(state.userPos) state.map.flyTo(state.userPos, 18);
  else toast("Ожидание GPS...");
}

async function loadScooters(){
  try {
    const r = await fetch(`${API_BASE}/api/scooters`);
    if(!r.ok) throw new Error('Офлайн');
    const data = await r.json();
    
    Object.values(state.markers).forEach(m => state.map.removeLayer(m));
    state.markers = {};
    state.scooters = data;

    data.forEach(s => {
      const marker = L.marker([s.lat, s.lng], {
        icon: L.divIcon({html:'<div class="marker">🛴</div>', iconSize:[36,36], iconAnchor:[18,18]})
      }).addTo(state.map);
      marker.on('click', () => selectScooter(s));
      state.markers[s.id] = marker;
    });

    renderList();
    document.getElementById('serverStatus').textContent = `Сервер онлайн. Самокатов: ${data.length}`;
    document.getElementById('serverStatus').style.color = 'var(--green)';
  } catch(e) {
    document.getElementById('serverStatus').textContent = 'Сервер офлайн';
    document.getElementById('serverStatus').style.color = 'var(--red)';
  }
}

function renderList(){
  const list = document.getElementById('scooterList');
  if(state.scooters.length === 0){ list.innerHTML = '<p style="text-align:center;color:var(--muted)">Нет доступных самокатов</p>'; return; }
  list.innerHTML = state.scooters.map(s => `
    <div class="scooter" onclick="selectScooterById('${s.id}')">
      <div style="font-size:24px">🛴</div>
      <div style="flex:1"><b>${s.id}</b><div style="font-size:12px;color:var(--muted)">Заряд: ${s.battery}%</div></div>
    </div>
  `).join('');
}

function selectScooterById(id){ selectScooter(state.scooters.find(s => s.id === id)); }

function selectScooter(s){
  state.selected = s;
  state.map.flyTo([s.lat, s.lng], 18);
  
  document.getElementById('sheet').innerHTML = `
    <h2 style="margin:0 0 4px">${s.id}</h2>
    <p style="color:var(--muted);margin:0 0 16px">Заряд: ${s.battery}%</p>
    <button class="btn btn-primary" onclick="startRide()">Начать поездку</button>
    <button class="btn btn-ring" onclick="ringScooter()">🔊 Прозвонить</button>
    <button class="btn btn-ghost" onclick="location.reload()">Назад</button>
  `;
}

async function ringScooter(){
  if(!state.selected) return;
  toast('Отправляем команду...');
  await fetch(`${API_BASE}/api/scooter/${state.selected.id}/command`, { method: 'POST', body: 'CALL' });
  toast('Самокат звонит!');
}

async function startRide(){
  if(!state.selected) return;
  await fetch(`${API_BASE}/api/scooter/${state.selected.id}/command`, { method: 'POST', body: 'START' });
  state.ride = { id: state.selected.id, start: Date.now() };
  
  document.getElementById('sheet').innerHTML = `
    <h2 style="color:var(--green)">В пути 🚀</h2>
    <p style="color:var(--muted)">Самокат: ${state.selected.id}</p>
    <div style="font-size:48px;font-weight:800;margin:20px 0" id="rideTimer">00:00</div>
    <button class="btn btn-ghost" onclick="endRide()">Завершить</button>
  `;
  
  setInterval(() => {
    if(!state.ride) return;
    const sec = Math.floor((Date.now() - state.ride.start) / 1000);
    document.getElementById('rideTimer').textContent = `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
  }, 1000);
}

async function endRide(){
  if(!state.ride) return;
  await fetch(`${API_BASE}/api/scooter/${state.ride.id}/command`, { method: 'POST', body: 'STOP' }).catch(()=>{});
  state.ride = null;
  location.reload();
}

initMap();
loadScooters();
setInterval(loadScooters, 5000);
</script>
</body>
</html>
