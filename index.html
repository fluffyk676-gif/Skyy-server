<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Skyy — Кикшеринг</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{ --bg:#121212; --card:#1c1c1e; --card-2:#2d2d2d; --accent:#ff5a1f; --green:#22c55e; --muted:#888; }
  body{ --bg-theme: #121212; --card-theme: #1c1c1e; --text-theme: #fff; margin:0; background:var(--bg-theme); color:var(--text-theme); overflow:hidden; font-family:sans-serif; transition: 0.3s; }
  #app{position:relative; height:100dvh; max-width:480px; margin:0 auto; overflow:hidden}
  
  #map{position:absolute; inset:0; z-index:1; background:#000}
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(1.2); transition: 0.3s; }
  body.light-theme .leaflet-tile-pane { filter: none; }
  body.light-theme { --bg-theme: #f8fafc; --card-theme: #fff; --text-theme: #0f172a; }
  
  .topbar{position:absolute; top:0; left:0; right:0; z-index:500; padding:16px; display:flex; gap:8px; pointer-events:none; align-items:center}
  .topbar > * { pointer-events: auto; }
  .btn-icon{width:44px; height:44px; background:var(--card); border-radius:14px; display:grid; place-items:center; font-size:20px; color:var(--text-theme); border:none; cursor:pointer;}
  .search-bar{flex:1; background:var(--card); border-radius:14px; padding:12px; font-size:14px; color:var(--text-theme);}
  
  .sheet{position:absolute; left:0; right:0; bottom:0; z-index:500; background:var(--card); border-radius:24px 24px 0 0; padding:20px; max-height:85vh; display:flex; flex-direction:column; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 -5px 20px rgba(0,0,0,0.3);}
  .grabber{width:40px; height:5px; background:#555; border-radius:3px; margin:0 auto 15px;}
  
  .btn{width:100%; padding:16px; border:none; border-radius:16px; font-size:16px; font-weight:700; cursor:pointer; text-align:center; background:var(--accent); color:#fff; margin-top:10px; transition: 0.2s;}
  .btn:active { transform: scale(0.98); }
  .btn-sec{background:var(--card-2); color:var(--text-theme);}
  
  .modal{display:none; position:absolute; inset:0; background:rgba(0,0,0,0.8); z-index:1000; align-items:flex-end; justify-content:center; opacity: 0; transition: opacity 0.3s;}
  .modal.active{display:flex; opacity: 1;}
  .modal-content{background:var(--card); width:100%; border-radius:24px 24px 0 0; padding:24px; text-align:center; max-height:90vh; overflow-y:auto; transform: translateY(100%); transition: transform 0.3s;}
  .modal.active .modal-content { transform: translateY(0); }
  
  input, textarea{width:100%; padding:16px; background:var(--card-2); border:none; border-radius:12px; color:var(--text-theme); margin-bottom:12px; font-size:16px; box-sizing:border-box;}
  
  .marker{background:var(--accent); width:36px; height:36px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:grid; place-items:center; border:3px solid #fff;}
  .marker span{transform:rotate(45deg); font-size:18px;}
  
  .user-dot { width: 18px; height: 18px; border-radius: 50%; background: #0ea5e9; border: 3px solid #fff; box-shadow: 0 0 0 5px rgba(14,165,233,0.3); }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div class="topbar">
    <div style="font-weight:800; font-size:20px;">Skyy</div>
    <div class="search-bar">🔍 Куда поедем?</div>
    <button class="btn-icon" onclick="openProfile()">👤</button>
  </div>
  
  <div class="sheet" id="sheet">
    <div class="grabber"></div>
    <h2 style="margin:0 0 10px;">Самокаты рядом</h2>
    <div id="scooterList" style="overflow-y:auto; max-height:40vh; margin-bottom:10px;"></div>
    <div style="font-size:12px; color:var(--muted); text-align:center;" id="serverStatus">Подключение...</div>
  </div>

  <!-- МОДАЛКИ -->
  <div class="modal" id="profileModal">
    <div class="modal-content">
      <h2>Личный кабинет</h2>
      <div id="authForm">
        <input type="text" id="usernameInput" placeholder="Логин">
        <input type="password" id="passwordInput" placeholder="Пароль">
        <button class="btn" onclick="login()">Войти</button>
        <button class="btn btn-sec" onclick="register()">Зарегистрироваться</button>
        <button class="btn btn-sec" onclick="closeProfile()">Закрыть</button>
      </div>
      <div id="loggedIn" style="display:none;">
        <p>Логин: <b id="userName"></b></p>
        <h1 style="font-size:42px; margin:10px 0; color:var(--green);" id="userBalance">0 ₽</h1>
        <p style="color:var(--muted); font-size:12px; margin-bottom:20px;">Баланс</p>
        <button class="btn" onclick="topUp()">Пополнить баланс</button>
        <button class="btn btn-sec" onclick="logout()">Выйти</button>
        <button class="btn btn-sec" onclick="closeProfile()">Закрыть окно</button>
      </div>
    </div>
  </div>

  <div class="modal" id="topupModal">
    <div class="modal-content">
      <h2>Пополнение</h2>
      <p style="color:var(--muted); margin-bottom:20px; font-size:14px;">Переведите сумму на номер <b>+7 985 805-33-95</b> (Сбер) и введите её ниже.</p>
      <input type="number" id="topupAmount" placeholder="Сумма (например, 100)">
      <button class="btn" onclick="confirmTopup()">Я перевел</button>
      <button class="btn btn-sec" onclick="document.getElementById('topupModal').classList.remove('active')">Отмена</button>
    </div>
  </div>
</div>

<script>
const API = 'https://skyy-server.onrender.com';
let user = JSON.parse(localStorage.getItem('skyy_user')) || null;

// Инициализация карты
const map = L.map('map', {zoomControl:false, maxZoom: 19}).setView([55.75, 37.61], 16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

// Синяя точка
if (navigator.geolocation) {
  navigator.geolocation.watchPosition((pos) => {
    const latlng = [pos.coords.latitude, pos.coords.longitude];
    if (!window.userMarker) {
      window.userMarker = L.marker(latlng, {
        icon: L.divIcon({ html: '<div class="user-dot"></div>', iconSize: [18,18], iconAnchor: [9,9] })
      }).addTo(map);
      map.setView(latlng, 17);
    } else {
      window.userMarker.setLatLng(latlng);
    }
  }, (err) => {}, { enableHighAccuracy: true });
}

// Загрузка самокатов
async function loadScooters() {
  try {
    const r = await fetch(API + '/api/scooters');
    const data = await r.json();
    document.getElementById('serverStatus').innerText = `Найдено: ${data.length}`;
    
    map.eachLayer(layer => { if(layer instanceof L.Marker && layer !== window.userMarker) map.removeLayer(layer); });
    
    data.forEach(s => {
      L.marker([s.lat, s.lng], { icon: L.divIcon({html:'<div class="marker"><span>🛴</span></div>', iconSize:[36,36], iconAnchor:[18,18]}) }).addTo(map);
    });
  } catch (e) {
    document.getElementById('serverStatus').innerText = 'Ошибка сети';
  }
}
setInterval(loadScooters, 5000);
loadScooters();

function openProfile() {
  document.getElementById('profileModal').classList.add('active');
  if(user) {
    document.getElementById('authForm').style.display = 'none';
    document.getElementById('loggedIn').style.display = 'block';
    document.getElementById('userName').innerText = user.username;
    document.getElementById('userBalance').innerText = user.balance + ' ₽';
  } else {
    document.getElementById('authForm').style.display = 'block';
    document.getElementById('loggedIn').style.display = 'none';
  }
}
function closeProfile() { document.getElementById('profileModal').classList.remove('active'); }

async function register() {
  const username = document.getElementById('usernameInput').value;
  const password = document.getElementById('passwordInput').value;
  if(!username || !password) return alert('Заполните поля');
  
  try {
    const r = await fetch(API + '/api/register', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username, password }) });
    const res = await r.json();
    if(res.error) return alert(res.error);
    user = res.user;
    localStorage.setItem('skyy_user', JSON.stringify(user));
    openProfile();
  } catch(e) { alert('Ошибка сервера. Попробуйте позже.'); }
}

async function login() {
  const username = document.getElementById('usernameInput').value;
  const password = document.getElementById('passwordInput').value;
  try {
    const r = await fetch(API + '/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username, password }) });
    const res = await r.json();
    if(res.error) return alert(res.error);
    user = res.user;
    localStorage.setItem('skyy_user', JSON.stringify(user));
    openProfile();
  } catch(e) { alert('Ошибка сервера. Попробуйте позже.'); }
}

function logout() { user = null; localStorage.removeItem('skyy_user'); closeProfile(); }

function topUp() { document.getElementById('topupModal').classList.add('active'); }
async function confirmTopup() {
  const amount = document.getElementById('topupAmount').value;
  if(!amount || amount < 30) return alert('Сумма от 30 рублей');
  await fetch(API + '/api/request-topup', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username: user.username, amount }) });
  document.getElementById('topupModal').classList.remove('active');
  alert('Заявка отправлена!');
}
</script>
</body>
</html>
