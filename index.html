<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Skyy — Кикшеринг</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{ --bg:#121212; --card:#1c1c1e; --card-2:#2d2d2d; --accent:#ff5a1f; --green:#22c55e; --muted:#888; }
  body{margin:0; background:var(--bg); color:#fff; overflow:hidden; font-family:sans-serif;}
  #app{position:relative; height:100dvh; max-width:480px; margin:0 auto; overflow:hidden}
  #map{position:absolute; inset:0; z-index:1; background:#000}
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(1.2); }

  .topbar{position:absolute; top:0; left:0; right:0; z-index:500; padding:16px; display:flex; gap:8px; pointer-events:none; align-items:center}
  .topbar > * { pointer-events: auto; }
  .btn-icon{width:44px; height:44px; background:var(--card-2); border-radius:14px; display:grid; place-items:center; font-size:20px; color:#fff; border:none; cursor:pointer;}
  .search-bar{flex:1; background:var(--card-2); border-radius:14px; padding:12px; font-size:14px; color:#fff;}
  
  .sheet{position:absolute; left:0; right:0; bottom:0; z-index:500; background:var(--card); border-radius:24px 24px 0 0; padding:20px; max-height:85vh; display:flex; flex-direction:column;}
  .btn{width:100%; padding:18px; border:none; border-radius:16px; font-size:16px; font-weight:700; cursor:pointer; text-align:center; background:var(--accent); color:#fff; margin-top:10px;}
  .btn-sec{background:var(--card-2); color:#fff;}

  .modal{display:none; position:absolute; inset:0; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center; padding:20px;}
  .modal.active{display:flex}
  .modal-content{background:var(--card); width:100%; border-radius:24px; padding:24px; text-align:center;}
  input{width:100%; padding:16px; background:var(--card-2); border:none; border-radius:12px; color:#fff; margin-bottom:12px; font-size:16px;}

  .marker{background:var(--accent); width:36px; height:36px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:grid; place-items:center; border:3px solid #fff;}
  .marker span{transform:rotate(45deg); font-size:18px;}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  
  <div class="topbar">
    <div style="font-weight:800; font-size:20px;">Skyy</div>
    <div class="search-bar">🔍 Куда поедем?</div>
    <button class="btn-icon" onclick="openProfile()">👤</button>
  </div>

  <div class="sheet" id="sheet">
    <h2 style="margin:0 0 10px;">Самокаты рядом</h2>
    <div id="scooterList" style="overflow-y:auto; max-height:40vh; margin-bottom:10px;"></div>
    <div style="font-size:12px; color:var(--muted); text-align:center;" id="serverStatus">Подключение...</div>
  </div>

  <!-- МОДАЛКА ПРОФИЛЯ -->
  <div class="modal" id="profileModal">
    <div class="modal-content">
      <h2>Личный кабинет</h2>
      <div id="loginForm">
        <p style="color:var(--muted); margin-bottom:20px;">Войдите, чтобы арендовать самокат</p>
        <input type="tel" id="phoneInput" placeholder="+7 999 000-00-00">
        <button class="btn" onclick="login()">Войти</button>
      </div>
      <div id="loggedIn" style="display:none;">
        <p>Ваш номер: <b id="userPhone"></b></p>
        <h1 style="font-size:42px; margin:10px 0; color:var(--green);" id="userBalance">0 ₽</h1>
        <p style="color:var(--muted); font-size:12px; margin-bottom:20px;">Баланс</p>
        
        <button class="btn" onclick="topUp()">Пополнить баланс</button>
        <button class="btn btn-sec" onclick="closeProfile()">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА ОПЛАТЫ (ПОПОЛНЕНИЕ) -->
  <div class="modal" id="topupModal">
    <div class="modal-content">
      <h2>Пополнение</h2>
      <p style="color:var(--muted); margin-bottom:20px; font-size:14px;">Переведите сумму на номер <b>+7 985 805-33-95</b> (Сбер), затем введите её ниже.</p>
      <input type="number" id="topupAmount" placeholder="Сумма (например, 100)">
      <button class="btn" onclick="confirmTopup()">Я перевел</button>
      <button class="btn btn-sec" onclick="document.getElementById('topupModal').classList.remove('active')">Отмена</button>
    </div>
  </div>

  <!-- МОДАЛКА ПОЕЗДКИ -->
  <div class="modal" id="rideModal">
    <div class="modal-content">
      <h2 style="color:var(--green);">Поездка началась</h2>
      <div style="font-size:64px; font-weight:800; margin:20px 0;" id="rideTimer">00:00</div>
      <button class="btn btn-sec" onclick="endRide()">Завершить поездку</button>
    </div>
  </div>
</div>

<script>
const API = 'https://skyy-server.onrender.com';
let user = null; // { phone, balance }
let currentScooter = null;
let rideInterval = null;
let rideStart = null;

const map = L.map('map', {zoomControl:false}).setView([55.75, 37.61], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// --- АВТОРИЗАЦИЯ ---
function openProfile() {
  document.getElementById('profileModal').classList.add('active');
  if(user) {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('loggedIn').style.display = 'block';
    document.getElementById('userPhone').innerText = user.phone;
    document.getElementById('userBalance').innerText = user.balance + ' ₽';
  } else {
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('loggedIn').style.display = 'none';
  }
}
function closeProfile() { document.getElementById('profileModal').classList.remove('active'); }

async function login() {
  const phone = document.getElementById('phoneInput').value;
  if(!phone) return alert('Введите номер');
  
  const r = await fetch(API + '/api/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ phone })
  });
  user = await r.json();
  openProfile();
}

// --- ПОПОЛНЕНИЕ ---
function topUp() { document.getElementById('topupModal').classList.add('active'); }

async function confirmTopup() {
  const amount = document.getElementById('topupAmount').value;
  if(!amount) return;
  
  const r = await fetch(API + '/api/request-topup', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ phone: user.phone, amount: amount })
  });
  
  if(r.ok) {
    document.getElementById('topupModal').classList.remove('active');
    alert('Запрос отправлен! Переведите деньги на номер +7 985 805-33-95 и подождите 1-2 минуты, пока оператор подтвердит оплату.');
  }
}

// --- ЗАГРУЗКА КАРТЫ ---
async function loadScooters() {
  try {
    const r = await fetch(API + '/api/scooters');
    const data = await r.json();
    
    map.eachLayer(layer => { if(layer instanceof L.Marker) map.removeLayer(layer); });
    document.getElementById('scooterList').innerHTML = '';
    
    data.forEach(s => {
      L.marker([s.lat, s.lng], {
        icon: L.divIcon({html:'<div class="marker"><span>🛴</span></div>', iconSize:[36,36], iconAnchor:[18,18]})
      }).addTo(map).on('click', () => selectScooter(s));
      
      document.getElementById('scooterList').innerHTML += `
        <div style="padding:12px; border-bottom:1px solid #333; display:flex; justify-content:space-between;" onclick='selectScooter(${JSON.stringify(s)})'>
          <div><b>${s.id}</b><br><small style="color:var(--muted)">Заряд: ${s.battery}%</small></div>
          <div style="color:var(--accent);">30 ₽ + 7 ₽/мин</div>
        </div>
      `;
    });
    
    document.getElementById('serverStatus').innerText = `Найдено самокатов: ${data.length}`;
  } catch (e) {
    document.getElementById('serverStatus').innerText = 'Ошибка сети';
  }
}

// --- ПОЕЗДКА ---
function selectScooter(s) {
  if(!user) { alert('Войдите в аккаунт!'); openProfile(); return; }
  currentScooter = s;
  
  if(user.balance < 30) {
    alert('Недостаточно средств! Пополните баланс (минимум 30 ₽).');
    topUp();
    return;
  }
  
  if(confirm(`Начать поездку на ${s.id}?\nСтоимость: 30 ₽ старт + 7 ₽/мин`)) {
    startRide();
  }
}

async function startRide() {
  const r = await fetch(API + '/api/start-ride', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ phone: user.phone, scooterId: currentScooter.id })
  });
  const res = await r.json();
  
  if(res.error) { alert(res.error); return; }
  
  user.balance = res.balance;
  rideStart = Date.now();
  
  document.getElementById('rideModal').classList.add('active');
  rideInterval = setInterval(() => {
    const sec = Math.floor((Date.now() - rideStart) / 1000);
    document.getElementById('rideTimer').innerText = `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
  }, 1000);
}

async function endRide() {
  clearInterval(rideInterval);
  const minutes = Math.ceil((Date.now() - rideStart) / 60000);
  
  const r = await fetch(API + '/api/end-ride', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ phone: user.phone, minutes })
  });
  const res = await r.json();
  
  user.balance = res.balance;
  document.getElementById('rideModal').classList.remove('active');
  
  alert(`Поездка завершена.\nСписано: ${res.cost} ₽\nВаш баланс: ${user.balance} ₽`);
  loadScooters();
}

setInterval(loadScooters, 5000);
loadScooters();
</script>
</body>
</html>
